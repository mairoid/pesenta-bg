name = "pesenta-nap"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Базата е в регион EEUR (Източна Европа) — записите по чл. 52о остават в ЕС.
[[d1_databases]]
binding = "DB"
database_name = "pesenta-nap"
database_id = "7afeafa5-87c9-4cd8-ae48-c1fc1dca7d9f"

# Публични стойности — стоят тук нарочно, за да се виждат при преглед на кода.
# Всички са вече публични в NAP-PLAN.md или в самия одиторски файл.
[vars]
EIK = "207427793"
# Уникален номер на е-магазина по чл. 52р, присвоен от НАП (21.07.2026)
E_SHOP_N = "RF0007086"
# Точно както е подадено в Приложение №33 — без https://, без www.
# НАП сверява този низ със заявлението.
DOMAIN_NAME = "pesenta.bg"
E_SHOP_TYPE = "1"
# Merchant ID на Stripe акаунта на „БАУФИЗИК" ЕООД
PROC_ID = "acct_1Tu6mNJi5XII3dF8"
# Фиксираният курс за левовата равностойност. От 01.01.2026 еврото е
# основната валута; левът се показва информативно и отпада на 08.08.2026.
BGN_RATE = "1.95583"
# Валута на сумите в одиторския файл и в QR кода.
# ЕВРО — потвърдено от счетоводителя (01.08.2026). Схемата на НАП е от
# 06.06.2022, отпреди еврото, и няма поле за валута, затова стойността се
# подразбира от съдържанието. Остава превключвател (приема и "BGN"), защото
# НАП може да излезе с указание — и двете суми се пазят в базата, тоест
# смяната не изисква преизчисляване.
AUDIT_CURRENCY = "EUR"
ART_NAME = "Песен по поръчка — авторски текст и музика, до 3:30 мин."
# Код на данъчна група за 0% ДДС. Потвърдено от счетоводителя (01.08.2026).
TAX_GROUP = "А"
SELLER_NAME = "„БАУФИЗИК\" ЕООД"
SELLER_ADDRESS = "гр. Велико Търново 5000, ул. „Цанко Церковски\" № 39, офис 214"
# Номерът е ВАЛИДЕН. „БАУФИЗИК" ЕООД е регистрирано по чл. 97а ЗДДС —
# специалната регистрация за услуги към/от лица в ЕС, не по общия ред.
# Затова номерът стои на документите, но данък НЕ се начислява и НЕ се
# посочва: чл. 113, ал. 9 ЗДДС го забранява изрично на лицата по чл. 97а
# и същевременно ги задължава да посочат основанието за неначисляването.
# Виж VAT_EXEMPT_NOTE по-долу.
SELLER_VAT = "BG207427793"

# Основанието за неначисляване, изисквано от чл. 113, ал. 9 ЗДДС. Показва се
# на е-бележката вместо ред със сума на ДДС. Точната формулировка е добре да
# се потвърди от счетоводител — тук е нередактирана от Мирослав.
# Мине ли дружеството по общия ред: изчисти този ред, иначе бележката ще
# твърди неначисляване, докато отдолу стои начислен данък.
VAT_EXEMPT_NOTE = "ДДС не се начислява на основание чл. 113, ал. 9 във връзка с чл. 97а ЗДДС."
# Публичният адрес на самия Worker — влиза в линка към бележката, който се
# праща по имейл. Попълва се СЛЕД първия `wrangler deploy`, когато Cloudflare
# отпечата адреса.
PUBLIC_BASE = "https://pesenta-nap.pesenta-nap.workers.dev"
# Подателят на имейла с бележката. Домейнът трябва да е потвърден в Brevo,
# иначе писмата отиват в спам или се отхвърлят.
MAIL_SENDER = "sales@pesenta.bg"
MAIL_SENDER_NAME = "Песента"

# ТАЙНИ — НЕ се пишат тук. Задават се с командите в README.md:
#   STRIPE_WEBHOOK_SECRET  подписът, с който Stripe удостоверява webhook-а
#   AUDIT_TOKEN            пази XML ендпойнта и подписва линковете към бележките
#   BREVO_API_KEY          изпращане на бележката по имейл

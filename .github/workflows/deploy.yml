name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # upload-pages-artifact качва каквото намери в path, а path беше "."
      # — тоест цялото repo. Вътрешната документация и одиторските файлове
      # се сервираха публично: pesenta.bg/NAP-PLAN.md, /README.md,
      # /nap-audit/*.xml и /.gitignore връщаха 200.
      # Изтриването е само в checkout-а на runner-а — файловете си остават
      # в repo-то непокътнати.
      - name: Strip non-site files from the artifact
        run: rm -rf nap-audit NAP-PLAN.md README.md .gitignore .github
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # upload-pages-artifact качва каквото намери в path, а path е "."
      # — тоест цялото repo. Всеки файл вътре получава публичен адрес, затова
      # тук се маха всичко, което не е сайт. Изтриването е САМО в checkout-а
      # на runner-а; файловете си остават в repo-то непокътнати.
      #
      # 28.08.2026: CLAUDE.md беше пропуснат от списъка и pesenta.bg/CLAUDE.md
      # връщаше 200 — вътрешните инструкции на проекта се четяха публично.
      # Добавени са и marketing/ (шаблонът на писмото, с работните бележки
      # вътре) и docs/ (концепцията, която описва къде са изложени частните
      # песни).
      #
      # ПРАВИЛОТО: нов работен документ в repo-то => добави го и тук. Иначе
      # става публичен, без никой да е поискал.
      - name: Strip non-site files from the artifact
        run: rm -rf nap-audit NAP-PLAN.md README.md CLAUDE.md .gitignore .github worker marketing docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow (08.10.2026): след качването казва на Bing кои страници от sitemap.xml са нови или
  # сменени в този push. Отделна задача с пълната история, защото deploy-ът по-горе трие файлове
  # от своя checkout. Провал тук не засяга сайта — той вече е качен. Вж. tools/indexnow.mjs.
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notify IndexNow
        run: node tools/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"

<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Връщане от TikTok | Pesenta.bg</title>
  <!-- Адрес за връщане (redirect URI) на приложението в TikTok за разработчици.
       Страницата е нарочно без логика: кодът за упълномощаване идва в адресната
       лента като ?code=… и човекът го копира оттам (references/16-connect-tiktok.md,
       раздел 3.1 в пакета КИБЕР АВТОПИЛОТ). Не е за търсачки, не е за клиенти. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0A1A; color: #F4F2FF; font-family: "Segoe UI", system-ui, sans-serif; }
    main { max-width: 640px; padding: 32px; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: #A9A4C9; line-height: 1.5; }
    code { display: block; margin-top: 16px; padding: 12px; background: #14132B; border-radius: 12px; word-break: break-all; color: #FFC46B; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>TikTok върна отговор.</h1>
    <p>Тази страница е служебна. Кодът за свързването е в адресната лента и в полето отдолу. Копирай го и се върни в терминала.</p>
    <code id="kod">…</code>
  </main>
  <script>
    // Показва само кода, за да не се рови в дългия адрес. Нищо не се праща никъде.
    var p = new URLSearchParams(location.search);
    var k = p.get('code');
    document.getElementById('kod').textContent = k ? decodeURIComponent(k) : 'Няма code в адреса. Ако виждаш error=…, върни се и опитай пак.';
  </script>
</body>
</html>

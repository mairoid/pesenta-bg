<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<!-- Генератор на снимката-бутон за писмото. Всичко тук се превръща в пиксели
     ПРЕДИ изпращането: марковият шрифт и тъмнината под надписа не съществуват
     в Outlook, който рендира през Word. Затова градиентът е позволен ТУК и е
     забранен в самото писмо. -->
<style>
  @font-face {
    font-family: "Unbounded";
    font-style: normal;
    font-weight: 600 800;
    src: url("file:///D:/My%20Documents%202026/Cyber%20Hora/pesenta.bg/assets/fonts/unbounded-cyrillic.woff2") format("woff2");
  }
  html, body { margin: 0; padding: 0; background: #040309; }
  .cta {
    position: relative; width: 976px; height: 380px;
    border: 4px solid #D2577F; box-sizing: border-box;
    overflow: hidden; background: #040309;
  }
  .fon { position: absolute; inset: 0; width: 100%; height: 100%;
         object-fit: cover; }
  /* Два слоя: единият изтегля тъмнината наляво, другият вдига под надписа. */
  .plast-a, .plast-b { position: absolute; inset: 0; }
  .plast-a { background: linear-gradient(95deg,
      rgba(4,3,9,0.97) 0%, rgba(4,3,9,0.94) 22%, rgba(4,3,9,0.66) 42%,
      rgba(4,3,9,0.30) 62%, rgba(4,3,9,0.18) 100%); }
  .plast-b { background: linear-gradient(to top,
      rgba(4,3,9,0.72) 0%, rgba(4,3,9,0.30) 26%, rgba(4,3,9,0) 48%); }
  .red { position: absolute; left: 40.5px; bottom: 32px;
         display: flex; align-items: center; gap: 30px; }
  .nadpis { font-family: "Unbounded", sans-serif; font-weight: 600;
            font-size: 31.7px; line-height: 1; color: #FFFFFF;
            letter-spacing: 0.004em; white-space: nowrap; }
  .krag { width: 42px; height: 42px; border-radius: 50%;
          background: #D2577F; display: flex;
          align-items: center; justify-content: center; flex: none; }
</style>
</head>
<body>
<div class="cta">
  <img class="fon" id="fon" alt="">
  <div class="plast-a"></div>
  <div class="plast-b"></div>
  <div class="red">
    <span class="nadpis">Отвори страницата</span>
    <span class="krag">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
           stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M12.5 6l6 6-6 6"/>
      </svg>
    </span>
  </div>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var f = document.getElementById("fon");
  f.src = p.get("i");
  f.style.objectPosition = "center " + (p.get("y") || "45") + "%";
</script>
</body>
</html>

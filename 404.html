<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <!-- resizes-content: при отворена клавиатура layout-ът се свива, вместо да се
       скролва — фиксираните елементи сядат НАД клавиатурата, не под нея.
       Безопасно е: в style.css няма нито една vh-базирана височина. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0a1a">
  <meta name="application-name" content="Песента">
  <meta name="apple-mobile-web-app-title" content="Песента">
  <title>Страницата не е намерена | Pesenta.bg</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <!-- Критичните (кирилски) шрифтове тръгват веднага, вместо да чакат CSS-а -->
  <link rel="preload" href="assets/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Латинските подмножества се теглят на ВСЯКА страница: запетаята, точката,
       тирето, кавичките и цифрите живеят в тях, не в кирилските. Без preload
       браузърът ги открива чак след като разбере CSS-а — цял round-trip по-късно,
       заради което пунктуацията в заглавията за миг е с резервния шрифт. -->
  <link rel="preload" href="assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Към съдържанието</a>
<main id="main" class="container order-wrap" style="text-align:center;">
  <h1 style="font-size:5rem;margin-bottom:0;">4<span class="grad-text">0</span>4</h1>
  <h2>Тази страница е изпяла последния си куплет</h2>
  <p class="muted">Адресът не съществува или е преместен. Но песента ти още те чака!</p>
  <p style="margin-top:2rem;">
    <a class="btn btn-primary btn-lg" href="/">Към началото</a>
    <a class="btn btn-ghost btn-lg" href="/poruchka.html">Поръчай песен</a>
  </p>
</main>
</body>
</html>
